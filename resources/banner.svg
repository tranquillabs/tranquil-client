<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" fill="none" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Tranquil Studio — a code editor and a web app side by side in one window">
  <!-- window frame -->
  <rect x="1" y="1" width="798" height="398" rx="4" fill="#1a1d24" stroke="#4c525c" stroke-width="1"/>
  <rect x="1.5" y="1.5" width="797" height="33" fill="#15181e"/>
  <line x1="1" y1="34" x2="799" y2="34" stroke="#4c525c" stroke-opacity="0.6"/>
  <circle cx="26" cy="17" r="6" fill="#e8735f"/>
  <circle cx="48" cy="17" r="6" fill="#e5a94d"/>
  <circle cx="70" cy="17" r="6" fill="#4ccb86"/>
  <text x="400" y="22" text-anchor="middle" font-size="13" fill="#7f838c" letter-spacing="0.5">Tranquil Studio</text>

  <!-- project pane -->
  <rect x="1" y="34" width="185" height="349" fill="#17191e"/>
  <text x="16" y="55" font-size="9.5" fill="#5b6068" letter-spacing="1.5">PROJECT</text>
  <g font-size="12" fill="#8a8f98">
    <text x="18" y="82">▾ src</text>
    <!-- active file row -->
    <rect x="1" y="90" width="185" height="22" fill="#78A4FF" fill-opacity="0.12"/>
    <rect x="1" y="90" width="2.5" height="22" fill="#78A4FF"/>
    <rect x="34" y="98" width="8" height="8" rx="1.5" fill="#78A4FF"/>
    <text x="48" y="106" fill="#ece8df">app.js</text>
    <rect x="34" y="121" width="8" height="8" rx="1.5" fill="#78A4FF"/>
    <text x="48" y="129">browser.js</text>
    <rect x="34" y="144" width="8" height="8" rx="1.5" fill="#64D1C8"/>
    <text x="48" y="152">styles.css</text>
    <text x="18" y="176">▸ resources</text>
    <rect x="18" y="191" width="8" height="8" rx="1.5" fill="#7f838c"/>
    <text x="32" y="199">readme.md</text>
    <rect x="18" y="214" width="8" height="8" rx="1.5" fill="#F3A15B"/>
    <text x="32" y="222">example.url</text>
  </g>

  <!-- tab strip -->
  <rect x="186" y="34" width="613" height="30" fill="#15181e"/>
  <line x1="186" y1="64" x2="799" y2="64" stroke="#4c525c" stroke-opacity="0.6"/>
  <rect x="192" y="40" width="140" height="24" rx="4" fill="#1a1d24"/>
  <rect x="192" y="61" width="140" height="3" fill="#78A4FF"/>
  <circle cx="206" cy="52" r="3.5" fill="#78A4FF"><animate attributeName="fill-opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="218" y="56" font-size="12" fill="#ece8df">app.js</text>
  <circle cx="352" cy="52" r="3.5" fill="none" stroke="#7f838c" stroke-width="1.4"/>
  <text x="364" y="56" font-size="12" fill="#7f838c">example.com</text>

  <!-- editor pane -->
  <g font-size="11" fill="#4c525c" text-anchor="end">
    <text x="214" y="92">1</text><text x="214" y="116">2</text><text x="214" y="140">3</text><text x="214" y="164">4</text><text x="214" y="188">5</text><text x="214" y="212">6</text><text x="214" y="236">7</text><text x="214" y="260">8</text><text x="214" y="284">9</text>
  </g>
  <g>
    <!-- L1 -->
    <rect x="226" y="83" width="46" height="9" rx="2" fill="#78A4FF" fill-opacity="0.8"/><rect x="280" y="83" width="60" height="9" rx="2" fill="#3a4049"/><rect x="348" y="83" width="14" height="9" rx="2" fill="#3a4049"/><rect x="370" y="83" width="58" height="9" rx="2" fill="#79D89D" fill-opacity="0.55"/>
    <!-- L3 (with cursor) -->
    <rect x="226" y="131" width="34" height="9" rx="2" fill="#78A4FF" fill-opacity="0.8"/><rect x="268" y="131" width="72" height="9" rx="2" fill="#3a4049"/>
    <rect x="348" y="129" width="8" height="14" fill="#78A4FF"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.05s" repeatCount="indefinite"/></rect>
    <!-- L4 -->
    <rect x="246" y="155" width="52" height="9" rx="2" fill="#3a4049"/><rect x="306" y="155" width="40" height="9" rx="2" fill="#78A4FF" fill-opacity="0.7"/><rect x="354" y="155" width="46" height="9" rx="2" fill="#3a4049"/>
    <!-- L5 -->
    <rect x="246" y="179" width="120" height="9" rx="2" fill="#3a4049"/><rect x="374" y="179" width="44" height="9" rx="2" fill="#79D89D" fill-opacity="0.55"/>
    <!-- L6 -->
    <rect x="246" y="203" width="30" height="9" rx="2" fill="#78A4FF" fill-opacity="0.7"/><rect x="284" y="203" width="86" height="9" rx="2" fill="#3a4049"/>
    <!-- L7 -->
    <rect x="266" y="227" width="80" height="9" rx="2" fill="#3a4049"/><rect x="354" y="227" width="40" height="9" rx="2" fill="#3a4049"/>
    <!-- L8 -->
    <rect x="226" y="251" width="18" height="9" rx="2" fill="#3a4049"/>
    <!-- L9 -->
    <rect x="226" y="275" width="58" height="9" rx="2" fill="#3a4049"/>
  </g>

  <!-- divider -->
  <line x1="506" y1="64" x2="506" y2="383" stroke="#4c525c" stroke-opacity="0.7"/>

  <!-- browser pane (a web app open beside the editor) -->
  <rect x="520" y="74" width="266" height="18" rx="9" fill="#12141a" stroke="#4c525c"/>
  <text x="530" y="87" font-size="10" fill="#b4afa6"><tspan fill="#78A4FF">⌂</tspan><tspan dx="4">example.com</tspan></text>
  <rect x="520" y="104" width="266" height="94" rx="6" fill="#78A4FF" fill-opacity="0.14"/>
  <path d="M645 141 l16 10 -16 10 z" fill="#78A4FF" fill-opacity="0.6"/>
  <rect x="520" y="212" width="248" height="9" rx="2" fill="#3a4049"/>
  <rect x="520" y="228" width="210" height="8" rx="2" fill="#2b2f38"/>
  <rect x="520" y="243" width="234" height="8" rx="2" fill="#2b2f38"/>
  <rect x="520" y="258" width="168" height="8" rx="2" fill="#2b2f38"/>
  <rect x="520" y="280" width="82" height="20" rx="10" fill="#78A4FF" fill-opacity="0.22" stroke="#78A4FF" stroke-opacity="0.4"/>
  <rect x="520" y="318" width="126" height="46" rx="6" fill="#22262e" stroke="#3a4049"/>
  <rect x="660" y="318" width="126" height="46" rx="6" fill="#22262e" stroke="#3a4049"/>

  <!-- status bar (per-window accent) -->
  <rect x="1" y="383" width="798" height="16" fill="#15181e"/>
  <rect x="1" y="383" width="104" height="16" fill="#78A4FF" fill-opacity="0.9"/>
  <text x="14" y="394" font-size="10" fill="#12141a">● main</text>
  <text x="789" y="394" text-anchor="end" font-size="10" fill="#6c7178">JavaScript · UTF-8 · tranquil</text>
</svg>
